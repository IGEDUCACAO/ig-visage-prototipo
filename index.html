<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f1e9">
<meta name="description" content="Protótipo navegável do app Art Visage Harmonie — prontuário de consultoria de cor.">
<title>Art Visage Harmonie — Prontuário v2</title>
<link rel="stylesheet" href="assets/styles.css">
<link rel="stylesheet" href="assets/prescricao.css">
<link rel="stylesheet" href="assets/fechamento.css">
</head>
<body>
<a class="pular-para-conteudo" href="#tela">Ir para o conteúdo</a>
<div class="app">
  <header class="topo">
    <div class="marca">
      <div class="marca-texto">
        <p class="marca-nome">Art Visage Harmonie</p>
        <p class="marca-sub">método Visage Harmonie · prontuário</p>
      </div>
      <p class="bloco-atual" id="blocoAtual">Bloco A · Abertura</p>
    </div>
    <div class="trilha-progresso" id="progresso"></div>
    <div class="passo-linha">
      <span class="tela-nome" id="telaNome">Quem está na cadeira?</span>
      <span class="tela-num" id="telaNum">Tela 1 de 17</span>
    </div>
  </header>

  <p class="aviso" id="aviso" role="status" hidden></p>

  <main class="tela" id="tela" tabindex="-1"></main>

  <footer class="rodape">
    <p class="rodape-motivo" id="rodapeMotivo" role="status" aria-live="polite"></p>
    <div class="acoes-rodape">
      <button type="button" class="btn btn-secundario" id="voltar">Voltar</button>
      <button type="button" class="btn btn-primario" id="avancar">Continuar</button>
    </div>
  </footer>
</div>

<noscript>
  <p class="aviso aviso-estatico">Este protótipo precisa de JavaScript para navegar entre as telas.</p>
</noscript>

<script src="assets/data.js" defer></script>
<script src="assets/engine.js" defer></script>
<script src="assets/telas-leitura.js" defer></script>
<script src="assets/telas-prescricao.js" defer></script>
<script src="assets/telas-fechamento.js" defer></script>
<script src="assets/app.js" defer></script>
</body>
</html>
