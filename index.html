<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f1e9">
<title>Art Visage Harmonie — Protótipo</title>
<style>
:root{
  --bg:#f6f1e9; --card:#fffdf9; --ink:#2a2521; --ink2:#6d6259; --line:#e4d9c9;
  --gold:#a9855a; --gold-d:#8a6a42; --ok:#2f6b4f; --warn:#9a5b2a;
  --radius:18px; --shadow:0 2px 10px rgba(90,70,45,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:#efe7db;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);display:flex;justify-content:center;align-items:stretch}
.phone{width:100%;max-width:430px;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;position:relative;box-shadow:0 0 40px rgba(0,0,0,.12)}
@media(min-width:900px){ .phone{margin:24px 0;min-height:calc(100vh - 48px);border-radius:34px;overflow:hidden;border:1px solid #e0d3c0} }

header{padding:18px 20px 12px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand h1{font-size:13px;letter-spacing:.16em;text-transform:uppercase;margin:0;color:var(--gold-d);font-weight:700}
.brand .sub{font-size:10.5px;color:var(--ink2);letter-spacing:.05em}
.progress{height:4px;background:#e9dfd1;border-radius:3px;margin-top:12px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--gold);width:0;transition:width .25s}
.step-label{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink2);margin-top:7px}
main{flex:1;padding:20px;overflow-y:auto}
h2{font-size:21px;line-height:1.25;margin:0 0 6px;font-weight:700;letter-spacing:-.01em}
.lead{font-size:13.5px;color:var(--ink2);margin:0 0 18px;line-height:1.5}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--gold-d);font-weight:700;margin:20px 0 8px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:15px 16px;font-size:15px;text-align:left;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:12px;width:100%;font-family:inherit;color:inherit}
.opt:active{transform:scale(.99)}
.opt.sel{border-color:var(--gold);background:#fdf8f0;box-shadow:0 0 0 3px rgba(169,133,90,.12)}
.opt small{display:block;font-size:12px;color:var(--ink2);margin-top:2px}
.opt .k{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;color:var(--ink2);flex:0 0 auto}
.opt.sel .k{border-color:var(--gold);background:var(--gold);color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.grid2 .opt,.grid3 .opt{padding:14px 10px;justify-content:center;text-align:center;font-size:13.5px}
textarea,input[type=text],input[type=date],input[type=number]{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:14px 15px;font-size:15px;font-family:inherit;color:var(--ink);resize:vertical}
textarea{min-height:110px;line-height:1.5}
input:focus,textarea:focus{outline:none;border-color:var(--gold)}
.hint{font-size:12px;color:var(--ink2);margin-top:8px;line-height:1.45}
.note{border-left:3px solid var(--gold);background:#fdf8ef;border-radius:0 12px 12px 0;padding:12px 14px;font-size:12.5px;color:#5c4a33;line-height:1.5;margin:14px 0}
.note b{color:var(--gold-d)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.card .row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed #eee4d6;font-size:13.5px}
.card .row:last-child{border-bottom:none}
.card .row span:first-child{color:var(--ink2)}
.card .row span:last-child{font-weight:600;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.chip{font-size:12px;padding:7px 11px;border-radius:999px;background:#f2e9db;color:#6b5638;border:1px solid #e6d8c3}
.chip.ok{background:#e8f1ea;color:#2f6b4f;border-color:#cfe2d6}
.chip.out{background:#f4ede6;color:#8a705a;border:1px solid #e7d9c9}
.chip.warn{background:#fbeee2;color:#8a4d1f;border:1px solid #efd3b8}
footer{padding:14px 20px calc(18px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg);display:flex;gap:10px}
.btn{flex:1;border:none;border-radius:14px;padding:16px;font-size:15.5px;font-weight:700;font-family:inherit;cursor:pointer}
.btn.primary{background:var(--gold);color:#fff;box-shadow:0 6px 16px rgba(169,133,90,.28)}
.btn.primary:disabled{background:#d9cdbb;box-shadow:none;color:#fff8}
.btn.ghost{flex:0 0 92px;background:transparent;color:var(--ink2);border:1.5px solid var(--line)}
.tag{display:inline-block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;background:#f0e6d6;color:var(--gold-d);padding:4px 9px;border-radius:999px;font-weight:700;margin-bottom:12px}
.tag.iris{background:#e7edf3;color:#3f5d78}
.tag.estilo{background:#f3e7ef;color:#7a3f68}
.tag.harmonia{background:#eef1e6;color:#4c6132}
.demo{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);font-size:10px;background:rgba(42,37,33,.82);color:#fff;padding:5px 10px;border-radius:999px;letter-spacing:.04em;z-index:9}
.dossie{background:#fff;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.dossie .capa{background:linear-gradient(160deg,#2a2521,#4a4038);color:#f6f1e9;padding:26px 20px}
.dossie .capa .k{font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;opacity:.75}
.dossie .capa h3{margin:10px 0 4px;font-size:21px;font-weight:600}
.dossie .capa p{font-size:11.5px;opacity:.8;margin:0}
.dossie .body{padding:16px}
.comp{display:flex;gap:10px;padding:11px 0;border-bottom:1px dashed #eee4d6;font-size:12.5px}
.comp:last-child{border:none}
.comp .n{width:22px;height:22px;border-radius:50%;background:#f0e6d6;color:var(--gold-d);font-size:11px;font-weight:700;display:grid;place-items:center;flex:0 0 auto}
.comp .t b{display:block;font-size:12.5px;margin-bottom:1px}
.comp .t span{color:var(--ink2);line-height:1.4}
.abs{color:#9a8574}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:100px;background:#2a2521;color:#fff;font-size:12.5px;padding:11px 16px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none;z-index:20;max-width:80%;text-align:center;line-height:1.4}
.toast.on{opacity:1;bottom:110px}
</style>
</head>
<body>
<div class="phone">
  <header>
    <div class="brand">
      <div>
        <h1>Art Visage Harmonie</h1>
        <div class="sub">método Visage Harmonie</div>
      </div>
      <div class="sub" id="hdrRoute"></div>
    </div>
    <div class="progress"><i id="bar"></i></div>
    <div class="step-label"><span id="stepName">Passo</span><span id="stepNum"></span></div>
  </header>
  <main id="view"></main>
  <footer>
    <button class="btn ghost" id="back">Voltar</button>
    <button class="btn primary" id="next">Continuar</button>
  </footer>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============ dados do método (v1.2 / Matriz v3) ============ */
const HEIGHTS=[1,3,4,5,6,7,8,9,10];
const FAM={
  PC:{nome:"Primavera Clara",faixa:[8,10],amostras:["8.34","8.4","8.7","8.73","9.2","9.3","10.3"],evitar:"Frios profundos e vermelhos escuros"},
  VC:{nome:"Verão Claro",faixa:[8,10],amostras:["8.1","9.1","10.1"],evitar:"Quentes profundos e saturados"},
  PE:{nome:"Primavera Essencial",faixa:[6,7],amostras:["6.4","6.47","6.66","6.7","7.2","7.4","7.47","7.7","7.73"],evitar:"Cinza e grafite puro; platinado frio"},
  VE:{nome:"Verão Essencial",faixa:[6,7],amostras:["6.1","7.1"],evitar:"Dourado intenso, acobreado e vermelho quente"},
  OP:{nome:"Outono Profundo",faixa:[1,4],amostras:["01.0","03.0","04.0"],evitar:"Platinados e perolados claros"},
  IP:{nome:"Inverno Profundo",faixa:[1,4],amostras:["01.0","03.0","04.0"],evitar:"Dourado intenso e cobre claro"}
};
const famOf=(p,t)=> p==="clara" ? (t==="quente"?"PC":"VC") : p==="media" ? (t==="quente"?"PE":"VE") : (t==="quente"?"OP":"IP");
function teto(base){
  const i=HEIGHTS.indexOf(base); if(i<0) return null;
  return HEIGHTS[Math.min(i+4,HEIGHTS.length-1)];
}
const fmtH=h=>String(h).padStart(2,"0");

/* ============ estado ============ */
const S={cliente:"Marina Albuquerque",desejo:"",rota:null,prof:null,temp:null,kit:false,contraste:null,base:null,saude:null,iris:{a:null,b:null,c:null},forma:null,familia:null,calib:null,amostra:null,teto:null,conflito:false,decisaoConflito:null,valorCons:null,valorCor:null,receita:"",manutencao:"",retorno:null};
let step=0;

/* ============ fluxo ============ */
function steps(){
  const s=[
    {id:"cliente",name:"Cliente"},{id:"desejo",name:"Desejo"},
    {id:"rota",name:"Rota"},{id:"pele",name:"Pele"},{id:"contraste",name:"Contraste"},
    {id:"base",name:"Base natural"},{id:"saude",name:"Saúde do fio"},
    {id:"iris",name:"Íris",cond:()=>S.rota==="iris"},
    {id:"forma",name:"Forma do rosto"},
    {id:"familia",name:"Família e calibração"},
    {id:"teto",name:"Teto e faixa",cond:()=>S.rota==="harmonia"},
    {id:"conflito",name:"Conflito",cond:()=>S.rota==="harmonia"},
    {id:"escolha",name:"Escolha final"},
    {id:"receita",name:"Receita e valores"},
    {id:"retorno",name:"Manutenção e retorno"},
    {id:"dossie",name:"Dossiê"}
  ];
  return s.filter(x=>!x.cond||x.cond());
}

/* ============ render ============ */
const view=document.getElementById("view");
function computeConflict(){
  S.conflito = !!(S.rota==="harmonia" && S.base && S.familia && S.teto && S.teto < FAM[S.familia].faixa[0]);
}
function render(){
  if(S.rota==="harmonia" && S.base) S.teto = teto(S.base);
  computeConflict();
  const list=steps(); if(step>list.length-1) step=list.length-1;
  // pula a tela de conflito quando não há conflito (contagem de etapas fica estável)
  while(list[step] && list[step].id==="conflito" && !S.conflito && step<list.length-1) step++;
  const cur=list[step];
  document.getElementById("stepNum").textContent=`${step+1} de ${list.length}`;
  document.getElementById("stepName").textContent=cur.name;
  document.getElementById("bar").style.width=((step+1)/list.length*100)+"%";
  document.getElementById("hdrRoute").textContent = S.rota? ({harmonia:"Rota Harmonia",iris:"Rota Íris",estilo:"Rota Estilo"})[S.rota] : "";
  document.getElementById("back").style.visibility = step===0?"hidden":"visible";
  const n=document.getElementById("next");
  n.textContent = cur.id==="dossie"?"Reiniciar demonstração":"Continuar";
  view.scrollTop=0;
  view.innerHTML = T[cur.id]();
  bind(cur.id);
  n.disabled = !canAdvance(cur.id);
}
function canAdvance(id){
  if(id==="rota") return !!S.rota;
  if(id==="pele") return !!S.prof && !!S.temp && S.kit;
  if(id==="contraste") return !!S.contraste;
  if(id==="base") return !!S.base;
  if(id==="saude") return !!S.saude && S.saude!=="sem";
  if(id==="iris") return !!(S.iris.a&&S.iris.b&&S.iris.c);
  if(id==="forma") return !!S.forma;
  if(id==="familia") return !!S.familia;
  if(id==="conflito") return !!S.decisaoConflito;
  if(id==="escolha") return !!S.amostra;
  return true;
}

const opt=(val,txt,sub,cls="")=>`<button class="opt ${cls}" data-v="${val}"><span class="k"></span><span>${txt}${sub?`<small>${sub}</small>`:""}</span></button>`;
const tagFor=()=> S.rota?`<div class="tag ${S.rota}">${({harmonia:"Rota Harmonia",iris:"Rota Íris",estilo:"Rota Estilo"})[S.rota]}</div>`:"";

const T={};
T.cliente=()=>`<h2>Quem está na cadeira?</h2><p class="lead">Busque a cliente ou crie o cadastro. Tudo o que for registrado fica no prontuário dela — e só você vê.</p>
  <input type="text" id="busca" placeholder="Buscar por nome" value="">
  <div class="opts" style="margin-top:14px">
    ${opt("Marina Albuquerque","Marina Albuquerque","Último atendimento: 12 mar 2026 · base 06","sel")}
    ${opt("Juliana Costa","Juliana Costa","Último atendimento: 03 fev 2026 · base 04")}
    ${opt("+ nova","Cadastrar nova cliente","Nome e contato")}
  </div>
  <div class="note"><b>O que esta tela não faz:</b> não interpreta o histórico, não sugere rota e não classifica a cliente.</div>`;

T.desejo=()=>`<h2>O que ela quer?</h2><p class="lead">Escreva com as palavras dela. Gíria, hesitação e “não sei” também são registro.</p>
  <textarea id="desejo" placeholder="Ex.: “queria um loiro mas sem ficar amarelo, meu cabelo já está castigado”">${S.desejo}</textarea>
  <div class="hint">Este texto vai para o dossiê como componente 1 — antes de qualquer cor.</div>
  <div class="note"><b>O que esta tela não faz:</b> não interpreta o desejo, não sugere rota, não classifica o pedido.</div>`;

T.rota=()=>`<h2>Qual caminho ela escolheu?</h2><p class="lead">A rota nasce da conversa. O app não sugere, não pré-seleciona e não infere pelo histórico.</p>
  <div class="opts">
    ${opt("harmonia","Harmonia","Ser lida como um todo — a cor nasce da pele","sel"===S.rota?"sel":"")}
    ${opt("iris","Íris","Reforçar o que já é — a cor nasce da íris",S.rota==="iris"?"sel":"")}
    ${opt("estilo","Estilo","Uma cor que não vem das características naturais",S.rota==="estilo"?"sel":"")}
  </div>`;

T.pele=()=>`<h2>Leitura da pele</h2><p class="lead">Profundidade e temperatura, lidas na pele. A temperatura só vale depois do Kit de Tecidos.</p>
  <div class="label">Profundidade</div>
  <div class="grid3">${["clara","media","profunda"].map(v=>opt(v,v==="media"?"Média":v[0].toUpperCase()+v.slice(1),"",S.prof===v?"sel":"")).join("")}</div>
  <div class="label">Temperatura</div>
  <div class="grid2">${opt("quente","Quente","",S.temp==="quente"?"sel":"")}${opt("fria","Fria","",S.temp==="fria"?"sel":"")}</div>
  <div class="label">Confirmação com o Kit de Tecidos</div>
  <div class="opts">${opt("kit","Temperatura confirmada no kit","Passo 3 do protocolo",S.kit?"sel":"")}</div>
  <div class="note"><b>O que esta tela não faz:</b> não infere temperatura por foto, por nome ou por histórico.</div>`;

T.contraste=()=>`<h2>Contraste</h2><p class="lead">Distância entre cabelo, sobrancelha, olhos e pele. Não existe instrumento físico para contraste — é declaração sua.</p>
  <div class="opts">
    ${opt("baixo","Baixo","",S.contraste==="baixo"?"sel":"")}
    ${opt("medio","Médio","",S.contraste==="medio"?"sel":"")}
    ${opt("alto","Alto","",S.contraste==="alto"?"sel":"")}
  </div>
  <div class="note"><b>Regra:</b> baixo ou médio → calibração <b>Suave</b>. Alto → <b>Intensa</b>.</div>`;

T.base=()=>`<h2>Base natural</h2><p class="lead">Ancore a base com a amostra na mão dela. O app não estima.</p>
  <div class="grid3">${HEIGHTS.map(h=>opt(h,fmtH(h),"",S.base===h?"sel":"")).join("")}</div>
  <div class="hint">A altura 02 não existe no mercado — a lista salta de 01 para 03.</div>`;

T.saude=()=>`<h2>Saúde do fio</h2><p class="lead">Avaliação obrigatória nas três rotas, antes de qualquer prescrição.</p>
  <div class="opts">
    ${opt("comporta","O fio comporta cor","",S.saude==="comporta"?"sel":"")}
    ${opt("comprometido","O fio está comprometido","Cuidados antes da cor",S.saude==="comprometido"?"sel":"")}
    ${opt("sem","Sem condição para receber cor","A prescrição fica bloqueada",S.saude==="sem"?"sel":"")}
  </div>
  <div class="note"><b>RN-22:</b> fio sem condição impede a prescrição, independentemente da rota.</div>`;

T.iris=()=>`<h2>Leitura da íris</h2><p class="lead">Só na Rota Íris. Três perguntas — a leitura é fato, a prescrição é gosto.</p>
  ${["Clareza","Temperatura","Profundidade"].map((t,i)=>{
    const keys=[["clara","media","escura"],["quente","fria","neutra"],["profunda","luminosa"]][i];
    const cur=[S.iris.a,S.iris.b,S.iris.c][i];
    return `<div class="label">${t}</div><div class="grid3">${keys.map(k=>opt(k,k[0].toUpperCase()+k.slice(1),"",cur===k?"sel":"")).join("")}</div>`;
  }).join("")}`;

T.forma=()=>`<h2>Forma do rosto</h2><p class="lead">Comparação com oito formas. Registro apenas — o app não prescreve corte.</p>
  <div class="grid2">${["Oval","Redondo","Quadrado","Retangular","Triangular","Triângulo invertido","Losangular","Hexagonal"].map(f=>opt(f.toLowerCase(),f,"",S.forma===f.toLowerCase()?"sel":"")).join("")}</div>`;

T.familia=()=>{
  S.familia = (S.prof&&S.temp)? famOf(S.prof,S.temp) : null;
  S.calib = S.contraste==="alto"?"INT":(S.contraste?"SUA":null);
  const f=S.familia?FAM[S.familia]:null;
  const rot = S.rota==="harmonia" ? ["Família prescrita","Calibração prescrita"] : S.rota==="iris" ? ["Família de referência","Calibração de referência"] : ["Ponto de partida","Calibração não se aplica"];
  return `<h2>Família e calibração</h2><p class="lead">Calculado a partir do que você registrou. Você confirma — este é o primeiro ponto de validação.</p>
  <div class="card">
    <div class="row"><span>${rot[0]}</span><span>${f?f.nome+" · "+S.familia:"—"}</span></div>
    <div class="row"><span>${rot[1]}</span><span>${S.rota==="estilo"?"—":(S.calib==="SUA"?"Suave":"Intensa")}</span></div>
    <div class="row"><span>Profundidade × temperatura</span><span>${S.prof||"—"} · ${S.temp||"—"}</span></div>
    <div class="row"><span>Contraste</span><span>${S.contraste||"—"}</span></div>
  </div>
  <div class="note"><b>${rot[0]}</b> — o rótulo muda com a rota. Chamar de “prescrita” na Rota Estilo seria erro.</div>`;
};

T.teto=()=>{
  S.teto = S.base? teto(S.base) : null;
  const f=FAM[S.familia]||null;
  S.conflito = !!(f && S.teto && S.teto < f.faixa[0]);
  const alcancaveis = f? f.amostras.filter(a=>{const h=parseInt(a.split(".")[0],10)||parseInt(a.slice(0,2),10); return h<=S.teto;}) : [];
  return `<h2>Teto e faixa alcançável</h2><p class="lead">Só existe na Rota Harmonia. Quatro degraus a partir da base, contados na régua do kit.</p>
  <div class="card">
    <div class="row"><span>Base natural</span><span>${fmtH(S.base)}</span></div>
    <div class="row"><span>Teto de clareamento</span><span>${fmtH(S.teto)}</span></div>
    <div class="row"><span>Faixa da família</span><span>${f?fmtH(f.faixa[0])+" a "+fmtH(f.faixa[1]):"—"}</span></div>
  </div>
  <div class="label">Alcançável hoje</div>
  <div class="chips">${alcancaveis.length?alcancaveis.map(a=>`<span class="chip ok">${a}</span>`).join(""):'<span class="chip warn">nenhuma amostra da família cabe no teto</span>'}</div>
  ${alcancaveis.length?"":'<div class="hint">O app mostra o conflito na próxima tela e não sugere substituto.</div>'}
  <div class="note"><b>Segundo ponto de validação.</b> A altura cede, a temperatura não.</div>`;
};

T.conflito=()=>{
  const f=FAM[S.familia];
  return `<h2>O teto está abaixo da família</h2><p class="lead">O app mostra o conflito e não decide. Não sugere amostra de outra família, não recalcula e não bloqueia.</p>
  <div class="card">
    <div class="row"><span>A pele pede</span><span>${f.nome} · ${fmtH(f.faixa[0])} a ${fmtH(f.faixa[1])}</span></div>
    <div class="row"><span>O fio alcança hoje</span><span>até ${fmtH(S.teto)}</span></div>
    <div class="row"><span>Situação</span><span style="color:#9a5b2a">conflito declarado</span></div>
  </div>
  <div class="label">Sua decisão</div>
  <div class="opts">
    ${opt("entrega_teto","Entregar o ponto mais alto que o fio suporta","Mantendo a temperatura da família",S.decisaoConflito==="entrega_teto"?"sel":"")}
    ${opt("adiar","Adiar a cor e tratar o fio primeiro","",S.decisaoConflito==="adiar"?"sel":"")}
  </div>
  <div class="note"><b>RN-20:</b> a decisão é registrada com data e aparece no prontuário.</div>`;
};

T.escolha=()=>{
  const f=FAM[S.familia]||{amostras:[]};
  let ops=f.amostras;
  if(S.rota==="harmonia") ops=f.amostras.filter(a=>{const h=parseInt(a.split(".")[0],10)||parseInt(a.slice(0,2),10); return h<=S.teto;});
  const st = S.rota==="harmonia"?"Amostras dentro do teto":S.rota==="iris"?"Paleta como referência · a íris marcada":"Paleta como ponto de partida · o desejo como desvio";
  return `<h2>Escolha final</h2><p class="lead">${st}. Quem escolhe é ela, com a amostra na mão.</p>
  ${ops.length? `<div class="chips">${ops.map(a=>`<span class="chip ${S.amostra===a?"ok":""}" data-amostra="${a}" style="cursor:pointer;font-size:13px;padding:9px 13px">${a}</span>`).join("")}</div>`
    : `<div class="note"><b>Nenhuma amostra da família dentro do teto.</b> O app não substitui e não recalcula. Registre a decisão que você tomou.</div>
       <div class="opts">${opt("manual","Registrar decisão do profissional","Fica no prontuário com data",S.amostra==="decisão registrada"?"sel":"")}</div>`}
  <div class="hint">${S.amostra?"Escolhida: "+S.amostra+(S.amostra!=="decisão registrada"?" · distância de "+dist(S.amostra)+" altura(s) da base":""):"Toque na amostra que ela escolheu."}</div>
  ${S.rota==="iris"?'<div class="note"><b>Ponto sobre a paleta:</b> a cor da íris é marcação, não prescrição.</div>':""}
  ${S.rota==="estilo"?'<div class="note"><b>Desvio consciente:</b> o desejo declarado é registrado como desvio — sem teto, só a saúde do fio limita.</div>':""}`;
};
function dist(a){ const h=parseInt(a.split(".")[0],10)||parseInt(a.slice(0,2),10); return Math.max(0,HEIGHTS.indexOf(h)-HEIGHTS.indexOf(S.base)); }

T.receita=()=>`<h2>Receita e valores</h2><p class="lead">Dois produtos separados. O app não soma, não totaliza e não sugere preço.</p>
  <div class="label">Receita técnica</div>
  <textarea id="receita" placeholder="Fórmula, tempo, oxidante, técnica...">${S.receita}</textarea>
  <div class="label">Valor da consultoria (R$)</div>
  <input type="number" id="vc" placeholder="0,00" value="${S.valorCons??""}">
  <div class="label">Valor do serviço de cor (R$)</div>
  <input type="number" id="vcor" placeholder="0,00" value="${S.valorCor??""}">
  <div class="note"><b>Nunca somados.</b> São dois campos independentes — nem total, nem sugestão.</div>`;

T.retorno=()=>`<h2>Manutenção e retorno</h2><p class="lead">A data é informada por você. O app não calcula e não sugere intervalo.</p>
  <div class="label">Plano de manutenção</div>
  <textarea id="manut" placeholder="Ex.: retoque de raiz em 6 semanas, máscara tonalizante a cada 15 dias">${S.manutencao}</textarea>
  <div class="label">Data prevista de retorno</div>
  <input type="date" id="ret">
  <div class="note"><b>RN-21:</b> campo de data manual. O lembrete dispara nessa data.</div>`;

T.dossie=()=>{
  const f=FAM[S.familia]||null;
  const h=S.rota==="harmonia";
  const comp=[];
  comp.push(["Rota declarada",`${({harmonia:"Harmonia",iris:"Íris",estilo:"Estilo"})[S.rota]} — “${S.desejo||"desejo não registrado"}”`]);
  comp.push([S.rota==="harmonia"?"Família prescrita":S.rota==="iris"?"Família de referência":"Ponto de partida", f?f.nome+" · "+(S.rota==="estilo"?"calibração não se aplica":"calibração "+(S.calib==="INT"?"Intensa":"Suave")):"—"]);
  if(h) comp.push(["Base natural e teto",`base ${fmtH(S.base)} · teto ${fmtH(S.teto)}`]);
  if(h) comp.push(["Faixa alcançável","marcada como alcançável hoje"]);
  if(h) comp.push(["Fora do alcance","marcado como “fora do alcance hoje”, nunca proibido"]);
  if(S.rota==="iris") comp.push(["Ponto sobre a paleta","a cor da íris marcada como ponto — leitura é fato, prescrição é gosto"]);
  if(S.rota==="estilo") comp.push(["Desvio declarado","o desejo da cliente registrado como desvio consciente"]);
  comp.push(["Aviso de cor de tela","cor de tela é direção; a decisão se confirma com a amostra na mão"]);
  comp.push(["Orientação de vestuário","orientação — não é consultoria de imagem"]);
  return `<h2>Dossiê da cliente</h2><p class="lead">${h?"Sete componentes, na ordem do protocolo.":"Nesta rota os componentes de teto não existem — a ordem começa pela rota e pela família."}</p>
  <div class="dossie">
    <div class="capa"><div class="k">Art Visage Harmonie</div><h3>${S.cliente}</h3><p>método Visage Harmonie · dossiê da consultoria</p></div>
    <div class="body">${comp.map((c,i)=>`<div class="comp"><div class="n">${i+1}</div><div class="t"><b>${c[0]}</b><span>${c[1]}</span></div></div>`).join("")}</div>
  </div>
  <div class="hint">Prévia. O PDF definitivo sai com a marca e o rodapé do curso.</div>
  <div class="note"><b>Fim da demonstração.</b> As telas acima são o fluxo; os valores são de exemplo.</div>`;
};

/* ============ interação ============ */
function bind(id){
  document.querySelectorAll("[data-v]").forEach(el=>el.onclick=()=>{
    const v=el.dataset.v;
    if(id==="cliente"){ S.cliente = v==="+ nova" ? "Nova cliente" : v; }
    if(id==="rota"){ S.rota=v; if(v!=="harmonia"){S.conflito=false;S.decisaoConflito=null;} }
    if(id==="pele"){ if(["clara","media","profunda"].includes(v))S.prof=v; else if(["quente","fria"].includes(v))S.temp=v; else if(v==="kit")S.kit=!S.kit; }
    if(id==="contraste") S.contraste=v;
    if(id==="base") S.base=parseInt(v,10);
    if(id==="saude") S.saude=v;
    if(id==="iris"){ const keys=[["clara","media","escura"],["quente","fria","neutra"],["profunda","luminosa"]]; if(keys[0].includes(v))S.iris.a=v; else if(keys[1].includes(v))S.iris.b=v; else S.iris.c=v; }
    if(id==="forma") S.forma=v;
    if(id==="escolha" && v==="manual") S.amostra="decisão registrada";
    if(id==="conflito") S.decisaoConflito=v;
    render();
  });
  document.querySelectorAll("[data-amostra]").forEach(el=>el.onclick=()=>{ S.amostra=el.dataset.amostra; render(); });
  const d=document.getElementById("desejo"); if(d) d.oninput=e=>S.desejo=e.target.value;
  const r=document.getElementById("receita"); if(r) r.oninput=e=>S.receita=e.target.value;
  const m=document.getElementById("manut"); if(m) m.oninput=e=>S.manutencao=e.target.value;
  const vc=document.getElementById("vc"); if(vc) vc.oninput=e=>S.valorCons=e.target.value;
  const vcor=document.getElementById("vcor"); if(vcor) vcor.oninput=e=>S.valorCor=e.target.value;
  const ret=document.getElementById("ret"); if(ret) ret.onchange=e=>S.retorno=e.target.value;
}

document.getElementById("next").onclick=()=>{
  const list=steps(); const cur=list[step];
  if(cur.id==="dossie"){ Object.assign(S,{desejo:S.desejo,rota:S.rota}); step=0; render(); toast("Demonstração reiniciada"); return; }
  step++; render();
};
document.getElementById("back").onclick=()=>{ if(step>0){step--;render();} };
function toast(t){ const el=document.getElementById("toast"); el.textContent=t; el.classList.add("on"); setTimeout(()=>el.classList.remove("on"),2200); }
render();
</script>
</body>
</html>
